<!doctype html><html lang="ja"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>写真の絵柄がえ帖</title>
<style>
/* プロンプト工房と同じ暗い配色・システムフォント。1列のカード（名前・向く写真・コピーできる文） */
:root{--bg:#14110f;--card:#1c1815;--line:#332c26;--ink:#f2ece4;--dim:#9c9187;--accent:#c8a678;--code:#171310;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;font-size:15px;line-height:1.75;padding-inline:16px;padding-block:0}
.wrap{max-width:720px;margin:0 auto;padding-block:24px 64px;display:grid;gap:18px}
.back{font-size:13px;margin:0}
.back a,.foot a{color:var(--accent)}
h1{font-size:19px;margin:0;letter-spacing:.04em;text-wrap:balance}
.lead{margin:2px 0 0;color:var(--dim);font-size:13px}
.how{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.how h2{font-size:14px;margin:0 0 6px;letter-spacing:.04em}
.how ol{margin:0;padding-left:1.3em;display:grid;gap:2px;font-size:14px}
.how p{margin:8px 0 0;color:var(--dim);font-size:12.5px}
.nav{display:flex;flex-wrap:wrap;gap:6px}
.nav a{font-size:13px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);text-decoration:none}
.nav a:focus-visible,.nav a:hover{border-color:var(--accent);outline:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:8px;scroll-margin-top:12px;min-width:0}
.card h3{font-size:16px;margin:0;letter-spacing:.03em}
.what{margin:0;font-size:14px}
.meta{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px;margin:0;font-size:13px}
.meta dt{color:var(--dim)}
.meta dd{margin:0}
pre{margin:0;background:var(--code);border:1px solid var(--line);border-radius:9px;padding:12px 14px;font-family:ui-monospace,monospace;font-size:12.5px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;max-height:9.8em;overflow:auto}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
button{font:inherit;font-size:14px;font-weight:600;border:1px solid var(--accent);border-radius:9px;padding:8px 16px;background:var(--accent);color:#1b1408;cursor:pointer}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.done{font-size:12.5px;color:var(--dim)}
.foot{font-size:12px;color:#6d645d;margin:0}
</style>

<div class="wrap">
  <p class="back"><a href="./">← プロンプト工房へ</a></p>
  <header>
    <h1>📷 写真の絵柄がえ帖</h1>
    <p class="lead">手元の写真を、ポスターや版画などの絵柄に描き直してもらうための頼み文集です。</p>
  </header>

  <section class="how">
    <h2>使い方</h2>
    <ol>
      <li>好きな絵柄の［コピー］を押す</li>
      <li>ChatGPT や Gemini を開き、写真を1枚添える</li>
      <li>コピーした文を貼って送る（英語のままでよい）</li>
      <li>直したい所は日本語で続けて頼む。カードの「変えどころ」が目安</li>
    </ol>
    <p>人が写った写真は、写っている人の了承を取ってから使ってください。</p>
  </section>

  <nav class="nav" id="nav" aria-label="絵柄の一覧"></nav>
  <main id="list" style="display:grid;gap:14px"></main>

  <p class="foot">フラットポスターは、ukiyo_teyanday さんの投稿（2026年9月）の考え方を参考に、短く書き直したものです。<a href="https://www.threads.com/@ukiyo_teyanday/post/Dc_H-5Qk3Te">元の投稿</a></p>
</div>

<script>
const BASE = "Redraw the attached photo in the style described below. Keep the main subject, the composition and the key shapes recognizable. Do not add any text, letters, logos or watermarks. Keep the original aspect ratio.";
const STYLES = [
  { name:"フラットポスター", what:"奥行きを捨て、形と色面だけで組んだ1950〜60年代の雑誌ポスター風。", fit:"料理、店先、街角、道具", knob:"色数（4〜6色）、主役の色",
    p:"STYLE: mid-century modern editorial poster. Extremely flat, vector-like shapes. Reduce every object to simple geometric forms and bold silhouettes. Flatten foreground and background into interlocking planes of solid color, like cut paper or a screen print. Little to no perspective, no realistic lighting or shading, no gradients. Strong cropping, asymmetrical balance, generous negative space. Palette of 4-6 colors such as deep navy, warm ivory, vermilion, cobalt blue and mustard yellow, with 1-2 dominant colors.\nAVOID: photorealism, 3D rendering, glossy finish, soft depth, anime style, cute mascot look." },
  { name:"浮世絵の木版画", what:"太い輪郭線とべた塗り、和紙の質感。江戸の錦絵の雰囲気。", fit:"風景、建物、人物、酒蔵", knob:"季節（雪・桜など）、空のぼかし",
    p:"STYLE: Japanese ukiyo-e woodblock print from the Edo period. Bold black outlines of even weight, flat areas of color, a limited traditional palette (indigo, vermilion, ochre, sage green, soft pink). Use bokashi gradation only in the sky or water. Stylized waves, clouds and patterns where they fit. Visible washi paper texture and slight woodgrain from the printing block.\nAVOID: photorealism, 3D shading, modern objects rendered realistically, Western perspective depth." },
  { name:"リソグラフ印刷", what:"2〜3色の重ね刷り。版ずれと粒々が味になる、手刷りの冊子風。", fit:"人物、小物、料理", knob:"インクの色（例：蛍光ピンク＋青）",
    p:"STYLE: risograph print made with only two ink colors, fluorescent pink and medium blue, overprinted to create a third color where they overlap. Visible halftone grain, slightly misaligned layers, uneven ink coverage, off-white paper. Simplified shapes with strong contrast.\nAVOID: smooth digital gradients, more than three colors, photorealism, glossy finish." },
  { name:"切り絵・紙の重なり", what:"色紙を切って重ねた立体的な紙工作。影で紙の厚みが出る。", fit:"風景、動物、季節もの", knob:"紙の枚数（層の数）",
    p:"STYLE: layered paper-cut artwork. Build the scene from 5-8 layers of cut colored paper stacked with small gaps, so each layer casts a soft shadow on the one behind it. Clean cut edges, matte paper texture, simplified rounded shapes. Calm, coordinated palette.\nAVOID: photorealism, glossy surfaces, text, busy small details." },
  { name:"線画＋淡い水彩", what:"ペンの線にさっと水彩をのせたスケッチ。旅の絵日記風。", fit:"街並み、店内、料理、旅先", knob:"色の量（線だけ寄り〜色多め）",
    p:"STYLE: loose urban-sketch illustration. Confident ink lines drawn with a fine pen, then light transparent watercolor washes that do not always stay inside the lines. Leave plenty of white paper showing. Soft, airy colors.\nAVOID: heavy shading, photorealism, digital airbrush look, dark backgrounds." },
  { name:"ぬりえの線画", what:"白地に黒い線だけ。塗り絵やワークシートの下絵に。", fit:"何でも。輪郭がはっきりした写真", knob:"線の太さ、細部の量",
    p:"STYLE: clean black-and-white line art for a coloring page. Pure black outlines of medium, even thickness on a pure white background. No fills, no gray tones, no shading or hatching. Closed shapes that are easy to color in. Simplify small details.\nAVOID: any color, gradients, textures, sketchy lines." },
  { name:"ドット絵", what:"低い解像度と限られた色の、昔のゲーム画面風。", fit:"人物、動物、建物、小物", knob:"大きさ（64×64など）、色数",
    p:"STYLE: retro pixel art, as if drawn at 64x64 pixels and scaled up with hard edges. Every pixel is a clean square. Limited palette of about 16 colors, no anti-aliasing, no blur. Clear silhouette, simple shading with 2-3 tones per color, like a 16-bit era game sprite or scene.\nAVOID: smooth gradients, photorealistic detail, soft edges, noise." },
  { name:"箱庭ミニチュア", what:"斜め上から見た小さな模型の世界。かわいい立体の島風。", fit:"建物、店、部屋、街の一角", knob:"切り取る範囲、背景の色",
    p:"STYLE: isometric 3D miniature diorama. Show the scene as a small square block of land viewed from a 45-degree isometric angle, with clean cut edges at the bottom. Soft clay-like or toy-like materials, gentle studio lighting, slightly simplified and rounded shapes. Plain pastel background.\nAVOID: realistic camera perspective, clutter, text, harsh shadows." },
  { name:"ステンドグラス", what:"鉛の線で区切られた色ガラス。光が透ける教会の窓風。", fit:"花、動物、人物、酒瓶", knob:"色の明るさ、光の向き",
    p:"STYLE: stained glass window. Divide the whole image into pieces of colored glass separated by thick dark lead lines. Rich jewel-tone colors with light glowing through the glass, slight variation and texture within each piece. Simplify the subject into bold shapes that fit the pieces.\nAVOID: photorealism, smooth gradients across pieces, text." },
  { name:"消しゴムはんこ・版画", what:"1色の手彫りはんこ。彫り跡とかすれが出る素朴な味。", fit:"小物、動物、料理、ロゴ風の題材", knob:"インクの色（朱・墨・藍）",
    p:"STYLE: hand-carved rubber stamp or linocut print in a single ink color (vermilion red) on off-white paper. Bold simplified shapes, visible carving marks, slightly uneven ink with small gaps and texture. No shading other than carved lines.\nAVOID: multiple colors, gradients, photorealism, fine detail." },
  { name:"昭和レトロ広告", what:"色あせた印刷の昭和の雑誌広告・ポスター風。", fit:"商品、店先、人物、乗り物", knob:"色あせの強さ、年代（昭和30年代など）",
    p:"STYLE: 1960s Japanese magazine advertisement illustration. Slightly faded offset printing with warm, muted colors, visible halftone dots and paper aging. Clean, optimistic commercial illustration style with simple shading. Leave an empty area where a headline could go later, but do not write any text.\nAVOID: modern digital look, glossy finish, any letters or text." },
  { name:"博物図鑑の細密画", what:"白地に標本のように描いた、古い図鑑の一枚。", fit:"食材、植物、道具、生き物", knob:"背景（白・生成り）、注記の線",
    p:"STYLE: vintage natural-history encyclopedia plate. Show the main subject isolated and centered on a plain cream paper background, drawn with precise fine ink lines and delicate hand-colored watercolor, like a 19th-century scientific illustration. Accurate proportions, careful detail, soft even lighting.\nAVOID: background scenery, dramatic lighting, text labels, modern digital look." }
];
const nav = document.getElementById("nav"), list = document.getElementById("list");
STYLES.forEach((s, i) => {
  const id = "s" + (i + 1), text = BASE + "\n\n" + s.p;
  nav.insertAdjacentHTML("beforeend", `<a href="#${id}">${s.name}</a>`);
  const card = document.createElement("article");
  card.className = "card"; card.id = id;
  card.innerHTML = `<h3>${s.name}</h3>
    <p class="what">${s.what}</p>
    <dl class="meta"><dt>向く写真</dt><dd>${s.fit}</dd><dt>変えどころ</dt><dd>${s.knob}</dd></dl>
    <pre id="${id}-p"></pre>
    <div class="row"><button type="button" id="${id}-b">コピー</button><span class="done" id="${id}-d" aria-live="polite"></span></div>`;
  list.appendChild(card);
  card.querySelector("pre").textContent = text;
  card.querySelector("button").addEventListener("click", () => {
    const done = card.querySelector(".done");
    const pick = () => { const r = document.createRange(); r.selectNodeContents(card.querySelector("pre")); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); done.textContent = "文を選択しました。長押しでコピーしてください"; };
    try {
      navigator.clipboard.writeText(text).then(() => { done.textContent = "コピーしました"; setTimeout(() => done.textContent = "", 2500); }, pick);
    } catch (e) { pick(); }
  });
});
</script>
